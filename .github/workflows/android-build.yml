name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build job ID"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-build-${{ github.event.inputs.build_id || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout build project
        uses: actions/checkout@v4
        with:
          path: android-project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Android project
        working-directory: android-project
        run: |
          test -f gradlew || (echo "Missing gradlew wrapper" && exit 1)
          test -f settings.gradle || test -f settings.gradle.kts || (echo "Missing settings.gradle" && exit 1)

      - name: Build debug APK
        working-directory: android-project
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.event.inputs.build_id || github.run_id }}
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 2
