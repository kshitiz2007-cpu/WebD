name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build job ID"
        required: true
        type: string
      build_branch:
        description: "Temporary branch containing submitted Android project"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-build-${{ github.event.inputs.build_id || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout submitted Android project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_branch }}
          path: android-project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Android project
        working-directory: android-project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts || (echo "Missing settings.gradle" && exit 1)
          test -f build.gradle || test -f build.gradle.kts || (echo "Missing root build.gradle" && exit 1)

      - name: Generate Gradle wrapper if missing
        working-directory: android-project
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.6.0
          fi
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-[0-9.]*-bin.zip/gradle-9.6.0-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          fi
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar || (echo "Gradle wrapper generation failed" && exit 1)

      - name: Align Java and Kotlin JVM targets to 17
        working-directory: android-project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path('app/build.gradle'), Path('app/build.gradle.kts')]
          for p in candidates:
              if not p.exists():
                  continue
              text = p.read_text()
              if p.suffix == '.kts':
                  block = '''
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          '''
              else:
                  block = '''
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          '''
              text = text.replace('options.release.set(17)', '')
              text = text.replace('options.release = 17', '')
              if 'sourceCompatibility' not in text:
                  p.write_text(text.rstrip() + chr(10) + block)
          PY

      - name: Build debug APK
        working-directory: android-project
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.event.inputs.build_id || github.run_id }}
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 2
