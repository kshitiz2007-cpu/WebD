services:
  webd-android-builder:
    build: .
    container_name: webd-android-builder
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ANDROID_BUILD_SERVICE_TOKEN: ${ANDROID_BUILD_SERVICE_TOKEN}
      BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-1200}
      MAX_PROJECT_BYTES: ${MAX_PROJECT_BYTES:-12000000}
      MAX_PROJECT_FILES: ${MAX_PROJECT_FILES:-1200}
      BUILD_WORK_ROOT: /work/jobs
    volumes:
      - webd-build-work:/work/jobs
    mem_limit: 6g
    cpus: 3.0
volumes:
  webd-build-work:
