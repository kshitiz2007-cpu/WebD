services:
  webd-android-builder:
    build:
      context: ./build-worker
    container_name: webd-android-builder
    restart: unless-stopped
    ports:
      - "${WEBD_BUILDER_PORT:-8080}:8080"
    environment:
      ANDROID_BUILD_TOKEN: ${ANDROID_BUILD_TOKEN:?Set ANDROID_BUILD_TOKEN in .env}
      BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-900}
    volumes:
      - webd-build-cache:/root/.gradle
    mem_limit: ${BUILDER_MEMORY_LIMIT:-6g}
    cpus: ${BUILDER_CPUS:-4}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  webd-build-cache:
